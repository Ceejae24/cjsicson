<form action="https://api.web3forms.com/submit" method="POST" class="space-y-6 text-left" data-aos="fade-up" data-aos-delay="200">
    <!-- YOUR WEB3FORMS ACCESS KEY -->
    <input type="hidden" name="access_key" value="61e32a56-8e46-4203-a756-2768ddc37b24">
    
    <!-- OPTIONAL REDIRECT: Replace with your actual live domain, or comment this line out while testing locally -->
    <!-- <input type="hidden" name="redirect" value="https://yourwebsite.com"> -->

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
            <label class="block text-xs font-bold text-black uppercase tracking-wider mb-2">Name</label>
            <input type="text" name="name" required class="w-full bg-altBg border border-slate-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors shadow-sm clickable">
        </div>
        <div>
            <label class="block text-xs font-bold text-black uppercase tracking-wider mb-2">Email</label>
            <input type="email" name="email" required class="w-full bg-altBg border border-slate-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors shadow-sm clickable">
        </div>
    </div>
    <div>
        <label class="block text-xs font-bold text-black uppercase tracking-wider mb-2">Message</label>
        <textarea name="message" rows="5" required class="w-full bg-altBg border border-slate-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors shadow-sm clickable"></textarea>
    </div>
    <button type="submit" class="w-full bg-black text-white font-bold tracking-widest uppercase py-4 rounded-lg hover:bg-primary transition-colors shadow-lg clickable">
        Send Message
    </button>
</form>
